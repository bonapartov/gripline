[project]
name = "gripline"
version = "0.1.0"
requires-python = ">=3.9"

[tool.black]
line-length = 80
extend-exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "mysite.settings.dev"

[tool.mypy]
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
exclude = [
    '^\..*',
    'migrations',
    'node_modules',
    'venv',
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mysite.settings.dev"
# --no-migrations: полный реплей website-миграций с нуля (как строит тестовую
# БД pytest-django по умолчанию) падает — минимум два подтверждённых бага в
# истории миграций (0013 дублировала 11 AddField, уже сделанных 0010;
# отдельно CreateModel на website_techarticleindexpage тоже дублируется
# где-то дальше по цепочке, не разбирался до конца — не входило в задачу,
# из-за которой это вообще всплыло). Первый баг исправлен (см. 0013), второй
# — нет. --no-migrations строит тестовую схему сразу из текущих моделей,
# в обход всей цепочки — надёжнее, чем чинить 38 миграций вручную ради
# одного нового тестового модуля.
addopts = "--no-migrations --cov --cov-report html"
python_files = "tests.py test_*.py"

[tool.ruff]
extend-exclude = ["migrations"]
line-length = 80

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
case-sensitive = false
force-single-line = true
lines-after-imports = 2
