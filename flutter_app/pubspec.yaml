name: gripline
description: Gripline — карт-федерация. Мобильное приложение для пилотов и болельщиков.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP и API
  dio: ^5.7.0
  retrofit: ^4.4.1

  # Состояние
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Хранение токена
  flutter_secure_storage: ^9.2.2

  # Навигация
  go_router: ^14.6.0

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  timeago: ^3.7.0

  # Push-уведомления
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Утилиты
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  retrofit_generator: ^9.1.6
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
