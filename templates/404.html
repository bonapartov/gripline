{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Трасса потеряна | Gripline</title>
    <link rel="stylesheet" href="{% static 'website/vendor/fontawesome/css/all.min.css' %}">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #15151c;
            color: #eceff1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .page-404 {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 780px;
            width: 100%;
        }

        .page-404__logo {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            color: #ffc107;
            text-decoration: none;
            margin-bottom: 2.5rem;
            display: inline-block;
        }

        .page-404__image {
            width: 100%;
            max-width: 680px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.30);
        }

        .page-404__image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .page-404__code {
            font-size: 5rem;
            font-weight: 900;
            color: #ffc107;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .page-404__title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.75rem;
        }

        .page-404__subtitle {
            font-size: 1rem;
            color: #b0bec5;
            margin-bottom: 2rem;
        }

        .page-404__actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-primary-gl {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #ffc107;
            color: #1a1a25;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            padding: 0.65rem 1.5rem;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .btn-primary-gl:hover {
            background: #ffca2c;
            color: #1a1a25;
        }

        .btn-outline-gl {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            color: #eceff1;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            padding: 0.65rem 1.5rem;
            border-radius: 8px;
            border: 1px solid #3a3a45;
            transition: border-color 0.2s, color 0.2s;
        }

        .btn-outline-gl:hover {
            border-color: #b0bec5;
            color: #ffffff;
        }

        @media (max-width: 575px) {
            .page-404__code { font-size: 3.5rem; }
            .page-404__title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="page-404">
        <a href="/" class="page-404__logo">GRIPLINE</a>

        <div class="page-404__image">
            <img src="{% static 'website/img/404.webp' %}" alt="404 — трасса потеряна">
        </div>

        <div class="page-404__code">404</div>
        <h1 class="page-404__title">Ой, трасса потеряна!</h1>
        <p class="page-404__subtitle">Страница не найдена — возможно, её переехал карт или она никогда не существовала.</p>

        <div class="page-404__actions">
            <a href="/" class="btn-primary-gl">
                <i class="fas fa-home"></i> На главную
            </a>
            <a href="/top/drivers/" class="btn-outline-gl">
                <i class="fas fa-trophy"></i> Рейтинг
            </a>
            <a href="/event_calendar/" class="btn-outline-gl">
                <i class="fas fa-calendar-alt"></i> Календарь
            </a>
        </div>
    </div>
</body>
</html>
