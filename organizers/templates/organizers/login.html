{% extends "coderedcms/pages/web_page.html" %}

{% block content %}
<style>
    .force-width-1500 { max-width: 1500px !important; margin: 0 auto; padding: 0 1rem; }
    .login-container { max-width: 600px; margin: 3rem auto; padding: 2rem; background-color: #1a1a25; border: 1px solid #2a2a35; border-radius: 8px; }
    .login-title { color: #ffc107; text-align: center; margin-bottom: 2rem; text-transform: uppercase; font-weight: bold; font-size: 2rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-label { color: #0dcaf0; font-size: 0.85rem; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 0.5rem; }
    .form-control { background-color: #15151c !important; border: 1px solid #2a2a35 !important; color: white !important; border-radius: 4px; padding: 0.75rem; width: 100%; }
    .btn-login { background-color: #ffc107; color: #000; border: none; padding: 0.75rem 2rem; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; }
    .auth-links { text-align: center; margin-top: 1.5rem; color: #adb5bd; }
    .auth-links a { color: #ffc107; text-decoration: none; }
</style>

<div class="force-width-1500 my-5">
    <div class="login-container">
        <h1 class="login-title">Вход для организатора</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn-login">Войти</button>
		<div class="text-center mt-3">
			<a href="{% url 'password_reset' %}" class="text-muted small">Забыли пароль?</a>
		</div>
        </form>
        <div class="auth-links">
            Нет аккаунта? <a href="{% url 'organizers:register' %}">Зарегистрироваться</a>
        </div>
    </div>
</div>
{% endblock %}
