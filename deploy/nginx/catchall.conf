# Catch-all: любой хост, кроме gripline.ru/www.gripline.ru, редиректит на
# основной домен. Причина (02.11.2026): cleantogo.ru указывает на тот же IP
# (сервер настраивался под этот домен), nginx отвечал сайтом на любой Host,
# и Google проиндексировал страницы Gripline под cleantogo.ru. 301 переносит
# выдачу на gripline.ru; ALLOWED_HOSTS в mysite/settings/prod.py домен больше
# не разрешает — дошедший мимо nginx запрос получает 400.
# Если cleantogo.ru понадобится для своего сайта — добавить для него
# server-блок с точным server_name: он перехватит трафик раньше catch-all.
# Установка: cp deploy/nginx/catchall.conf /etc/nginx/sites-available/catchall
#            ln -sf /etc/nginx/sites-available/catchall /etc/nginx/sites-enabled/
#            nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;
    return 301 https://gripline.ru$request_uri;
}

# Сертификат gripline.ru здесь только чтобы TLS-рукопожатие завершилось и
# краулер получил 301, а не ошибку соединения. Клиент увидит несовпадение
# имени в сертификате — для редирект-блока это несущественно.
server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/gripline.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gripline.ru/privkey.pem;
    return 301 https://gripline.ru$request_uri;
}
