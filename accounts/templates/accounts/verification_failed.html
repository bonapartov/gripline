{% extends "coderedcms/pages/web_page.html" %}
{% load static %}

{% block content %}
<style>
    .force-width-1500 {
        max-width: 1500px !important;
        margin-left: auto !important;
        margin-right: auto !important;
        padding-left: 1rem !important;
        padding-right: 1rem !important;
    }

    .failed-container {
        max-width: 600px;
        margin: 3rem auto;
        padding: 2rem;
        background-color: #1a1a25;
        border: 1px solid #2a2a35;
        border-radius: 8px;
        text-align: center;
    }

    .failed-title {
        color: #dc3545;
        text-align: center;
        margin-bottom: 2rem;
        text-transform: uppercase;
        font-weight: bold;
        font-size: 2rem;
    }

    .failed-icon {
        font-size: 4rem;
        color: #dc3545;
        margin-bottom: 1.5rem;
    }

    .failed-message {
        color: #ffffff;
        font-size: 1.2rem;
        margin-bottom: 1rem;
        line-height: 1.6;
    }

    .failed-info {
        color: #adb5bd;
        margin-bottom: 2rem;
        padding: 1rem;
        background-color: #15151c;
        border-radius: 8px;
        border: 1px solid #2a2a35;
    }

    .btn-resend {
        background-color: #ffc107;
        color: #000;
        border: none;
        padding: 0.75rem 2rem;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
        width: 100%;
        text-decoration: none;
        display: inline-block;
    }

    .btn-resend:hover {
        background-color: #e0a800;
        transform: translateY(-2px);
        color: #000;
        text-decoration: none;
    }

    .btn-home {
        background-color: transparent;
        color: #6c757d;
        border: 1px solid #6c757d;
        padding: 0.75rem 2rem;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
        width: 100%;
        text-decoration: none;
        display: inline-block;
        margin-top: 1rem;
    }

    .btn-home:hover {
        background-color: #6c757d;
        color: white;
        text-decoration: none;
    }
</style>

<div class="force-width-1500 my-5">
    <div class="failed-container">
        <div class="failed-icon">⚠️</div>
        <h1 class="failed-title">Ссылка недействительна</h1>

        <div class="failed-message">
            Ссылка для подтверждения email устарела или была использована ранее.
        </div>

        <div class="failed-info">
            <i class="fas fa-clock"></i> Ссылка действительна только 30 минут
        </div>

        <a href="{% url 'accounts:resend_verification' %}" class="btn-resend">Запросить новое письмо</a>
        <a href="/" class="btn-home">На главную</a>
    </div>
</div>
{% endblock %}
