{% extends "coderedcms/pages/web_page.html" %}
{% load static %}

{% block content %}
<style>
    .force-width-1500 {
        max-width: 1500px !important;
        margin-left: auto !important;
        margin-right: auto !important;
        padding-left: 1rem !important;
        padding-right: 1rem !important;
    }

    .verification-container {
        max-width: 600px;
        margin: 3rem auto;
        padding: 2rem;
        background-color: #1a1a25;
        border: 1px solid #2a2a35;
        border-radius: 8px;
        text-align: center;
    }

    .verification-title {
        color: #ffc107;
        text-align: center;
        margin-bottom: 2rem;
        text-transform: uppercase;
        font-weight: bold;
        font-size: 2rem;
    }

    .verification-icon {
        font-size: 4rem;
        color: #0dcaf0;
        margin-bottom: 1.5rem;
    }

    .verification-message {
        color: #ffffff;
        font-size: 1.2rem;
        margin-bottom: 1rem;
        line-height: 1.6;
    }

    .verification-info {
        color: #adb5bd;
        margin-bottom: 2rem;
        padding: 1rem;
        background-color: #15151c;
        border-radius: 8px;
        border: 1px solid #2a2a35;
    }

    .verification-info i {
        color: #0dcaf0;
        margin-right: 0.5rem;
    }

    .btn-resend {
        background-color: #ffc107;
        color: #000;
        border: none;
        padding: 0.75rem 2rem;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
        width: 100%;
        text-decoration: none;
        display: inline-block;
        margin-top: 1rem;
    }

    .btn-resend:hover {
        background-color: #e0a800;
        transform: translateY(-2px);
        color: #000;
        text-decoration: none;
    }

    .btn-home {
        background-color: transparent;
        color: #6c757d;
        border: 1px solid #6c757d;
        padding: 0.75rem 2rem;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
        width: 100%;
        text-decoration: none;
        display: inline-block;
        margin-top: 1rem;
    }

    .btn-home:hover {
        background-color: #6c757d;
        color: white;
        text-decoration: none;
    }
</style>

<div class="force-width-1500 pt-5 pb-5">
    <div class="verification-container">
        <div class="verification-icon">📧</div>
        <h1 class="verification-title">Проверьте почту</h1>

        <div class="verification-message">
            На указанный email отправлено письмо с ссылкой для подтверждения.
        </div>

        <div class="verification-info">
            <i class="fas fa-clock"></i> Ссылка действительна 30 минут
        </div>

        <div class="verification-info">
            <i class="fas fa-envelope"></i> Если письмо не пришло — проверьте папку Спам
        </div>

        <a href="{% url 'accounts:resend_verification' %}" class="btn-resend">Отправить письмо ещё раз</a>
        <a href="/" class="btn-home">На главную</a>
    </div>
</div>
{% endblock %}
