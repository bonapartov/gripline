{% load website_tags %}
{% get_social_auth_settings as social_auth %}
{% if social_auth.yandex_enabled or social_auth.vk_enabled %}
<div style="margin: 1.5rem 0;">
    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem;">
        <hr style="flex:1;border-color:#2a2a35;margin:0;">
        <span style="color:#6c757d;font-size:0.85rem;white-space:nowrap;">или войдите через</span>
        <hr style="flex:1;border-color:#2a2a35;margin:0;">
    </div>
    <div style="display:flex;gap:0.75rem;">
        {% if social_auth.yandex_enabled %}
        <a href="{% url 'social:begin' 'yandex-oauth2' %}?role={{ role|default:'pilot' }}"
           style="flex:1;display:flex;align-items:center;justify-content:center;gap:0.5rem;background:#fc3f1d;color:#fff;padding:0.7rem 0.5rem;border-radius:6px;text-decoration:none;font-weight:600;font-size:0.9rem;min-width:0;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white" style="flex-shrink:0;"><path d="M2.04 12c0-5.523 4.476-10 9.999-10C17.522 2 22 6.477 22 12s-4.478 10-10.001 10C6.516 22 2.04 17.523 2.04 12zm8.793 0H9.4v5.208H7.14V6.792H11.5c2.368 0 3.846 1.254 3.846 3.254 0 1.589-.852 2.694-2.264 3.107L15.34 17.208h-2.498L10.833 12zm-.413-3.536v1.855H11.44c1.037 0 1.614-.491 1.614-1.256 0-.765-.577-1.256-1.614-1.256H10.42z"/></svg>
            Яндекс ID
        </a>
        {% endif %}
        {% if social_auth.vk_enabled %}
        <a href="{% url 'social:begin' 'vk-id' %}?role={{ role|default:'pilot' }}"
           style="flex:1;display:flex;align-items:center;justify-content:center;gap:0.5rem;background:#0077ff;color:#fff;padding:0.7rem 0.5rem;border-radius:6px;text-decoration:none;font-weight:600;font-size:0.9rem;min-width:0;">
            <i class="fab fa-vk" style="flex-shrink:0;font-size:1.1rem;"></i>
            VK ID
        </a>
        {% endif %}
    </div>
</div>
{% endif %}
