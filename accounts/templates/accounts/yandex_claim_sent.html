{% extends "coderedcms/pages/web_page.html" %}

{% block content %}
<style>
    .force-width-1500 { max-width: 1500px !important; margin: 0 auto; padding: 0 1rem; }
    .claim-sent-box { max-width: 560px; margin: 4rem auto; padding: 2.5rem 2rem; background: #1a1a25; border: 1px solid #2a2a35; border-radius: 12px; text-align: center; }
    .claim-sent-icon { font-size: 3rem; margin-bottom: 1rem; }
    .claim-sent-title { color: #ffc107; font-size: 1.5rem; font-weight: bold; margin-bottom: 0.75rem; }
    .claim-sent-text { color: #adb5bd; font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem; }
    .btn-home { display: inline-block; background: #ffc107; color: #000; font-weight: bold; padding: 0.65rem 1.75rem; border-radius: 6px; text-decoration: none; }
    .btn-home:hover { background: #e0a800; color: #000; }
</style>

<div class="force-width-1500 my-5">
    <div class="claim-sent-box">
        <div class="claim-sent-icon">✅</div>
        <h1 class="claim-sent-title">Заявка отправлена</h1>
        <p class="claim-sent-text">
            Ваш аккаунт создан через Яндекс ID.<br>
            Заявка передана администратору — после одобрения вы получите доступ к личному кабинету.<br><br>
            Войдите снова после получения подтверждения.
        </p>
        <a href="/" class="btn-home">На главную</a>
    </div>
</div>
{% endblock %}
